
requires = ["tox>=4.51", "tox-uv"]
env_list = [
    "format",
    "build",
    "3.15",
    "3.15t",
    "combine",
    "coverage",
    "dependencies",
    "lint",
    "typing",
]

[env_run_base]
description = "run unit tests on Python {py_dot_ver} (free-threaded: {py_free_threaded})"
base_python_file = [ ".python-version" ]
runner = "uv-venv-lock-runner"
dependency_groups = ["tests"]
commands = [
    [
        "coverage",
        "run",
        "-m",
        "pytest",
        { replace = "posargs", default = [
            "-v",
        ], extend = true },
    ],
]

[env.format]
description = "format code"
labels = ["check"]
dependency_groups = ["lint"]
commands = [
    [
        "ruff",
        "check",
        "--fix",
        { replace = "posargs", default = [
        ], extend = true },
    ],
    [
        "ruff",
        "format",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[env.lint]
description = "lint code"
labels = ["check"]
dependency_groups = ["lint"]
depends = ["format"]
commands = [
    [
        "ruff",
        "check",
        { replace = "posargs", default = [
        ], extend = true },
    ],
    [
        "ruff",
        "format",
        "--diff",
        { replace = "posargs", default = [
        ], extend = true },
    ],
    [
        "tach",
        "check",
    ],
]

[tool.tox.env.typing]
description = "run type checking"
labels = ["check"]
dependency_groups = ["typing"]
commands = [
    [ "mypy", "--version" ],
    [
        "mypy",
        { replace = "posargs", default = [
            "src",
            "tests",
            "build.py",
        ], extend = true },
    ],
    [ "ty", "--version" ],
    [
        "ty",
        "check",
        { replace = "posargs", default = [
            "src",
            "tests",
            "build.py",
        ], extend = true },
    ],
    [ "pyrefly", "--version" ],
    [
        "pyrefly",
        "coverage",
        "check",
        { replace = "posargs", default = [
            "src",
            "tests",
            "build.py",
        ], extend = true },
    ],
    [
        "pyrefly",
        "check",
        { replace = "posargs", default = [
            "src",
            "tests",
            "build.py",
        ], extend = true },
    ],
    [ "pyright", "--version" ],
    [
        "pyright",
        { replace = "posargs", default = [
            "src",
            "tests",
            "build.py",
        ], extend = true },
    ],
]

[env.dependencies]
description = "check for missing and unused dependencies"
labels = ["check"]
dependency_groups = [ "dev" ]
commands = [ [ "deptry", "src" ]]

[env.build]
description = "build the plugin database"
dependency_groups = ["build"]
commands = [
    [
        "python",
        "-I",
        "build.py",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[env."3.15"]
depends = ["build"]

[env.combine]
description = "combine coverage reports"
skip_install = true
dependency_groups = [ "coverage" ]
depends = ["3.15"]
commands = [[ "coverage", "combine" ]]

[env.coverage]
description = "generate coverage report"
skip_install = true
dependency_groups = ["coverage"]
depends = ["combine"]
commands = [
    [
        "coverage",
        { replace = "posargs", default = [
            "report",
            "--fail-under=100",
            "--show-missing",
        ], extend = true },
    ],
]

[env.serve]
description = "serve the application"
dependency_groups = ["dev"]
commands = [
    [
        "dotenv",
        "-f",
        ".env",
        "run",
        "granian",
        "hub_api.main:app",
        { replace = "posargs", default = [
            "--port=8000",
        ], extend = true },
    ],
]

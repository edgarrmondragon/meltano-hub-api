name: Lint

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 12:00 PM UTC
  - cron: "0 12 * * 1"

env:
  FORCE_COLOR: "1"
  RUFF_OUTPUT_FORMAT: github
  UV_CONSTRAINT: ${{ github.workspace }}/.github/workflows/resources/requirements.txt

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-26.04
    continue-on-error: false
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v10.3.3
    - run: uvx prek run --all-files

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  lockfile:
    name: Verify GHA lock
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

[project]
name = "hub-api"
version = "0.1.0"
description = "API for hub.meltano.com"
authors = [
    { name = "Edgar Ramírez Mondragón", email = "edgarrm358@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "aiosqlite==0.22.1",
    "fastapi==0.141.1",
    "granian[reload]==2.8.2",
    "packaging==26.3",
    "pydantic==2.14.0b2",
    "python-json-logger==4.2.0",
    "starlette==1.6.0",
]

[dependency-groups]
build = [
    "platformdirs~=4.9",
    "PyYAML~=6.0",
    "urllib3~=2.8",
]
coverage = ["coverage>=7.16.1,<8"]
dev = [
    "deptry>=0.24.0",
    { include-group = "build" },
    { include-group = "lint" },
    { include-group = "tests" },
    { include-group = "typing" },
]
lint = [
    "ruff~=0.16.0",
    "tach>=0.34.0",
]
tests = [
    { include-group = "coverage" },
    "faker~=40.1",
    "httpx2~=2.4",
    "pytest~=9.0",
    "pytest-asyncio~=1.3",
    "pytest-github-actions-annotate-failures~=0.3",
    "syrupy~=6.0",
]
typing = [
    { include-group = "build" },
    { include-group = "tests" },
    "mypy~=2.3.0",
    "pyrefly>=1.2.0",
    "pyright>=1.1.411",
    "ty==0.0.84",
    "types-PyYAML>=6.0.12.20240808",
]

[tool.uv]
preview = true
required-version = ">=0.12"
override-dependencies = [
    "mypy @ git+https://github.com/python/mypy.git@master"
]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "granian",  # Not imported, but used as the ASGI server as a uvicorn alternative
    "python-json-logger",  # Imported dynamically by logging configuration
]

[tool.ruff]
line-length = 120
preview = true
required-version = ">=0.16"

[tool.ruff.lint]
ignore = ["missing-trailing-comma"]
select = [
    "F",     # PyFlakes
    "W",     # pycodestyle (Warning)
    "E",     # pycodestyle (Error)
    "C90",   # mccabe
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EM",    # flake8-errmsg
    "FA",    # flake8-future-annotations
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PT",    # flake8-pytest-style
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "PGH",   # pygrep-hooks
    "PL",    # Pylint
    "FAST",  # FastAPI
    "PERF",  # Perflint
    "FURB",  # refurb
    "LOG",   # flake8-logging
    "RUF",   # Ruff-specific rules
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["assert"]

[tool.pytest]
addopts = ["--durations=5", "-ra"]
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "error",
]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = ["tests"]

[tool.mypy]
enable_error_code = [
    "explicit-override",
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "exhaustive-match",    # https://mypy.readthedocs.io/en/stable/error_code_list2.html#check-that-match-statements-match-exhaustively-exhaustive-match
]
strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true
warn_redundant_casts = true

[tool.coverage.run]
branch = true
parallel = true

[tool.ty.rules]
unused-type-ignore-comment = "ignore"

[tool.pyrefly]
check-unannotated-defs = true
enabled-ignores = ["pyrefly"]
infer-return-types = "never"
preset = "strict"

[tool.pyrefly.errors]
missing-override-decorator = "error"
non-exhaustive-match = "error"
unused-call-result = "error"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"
